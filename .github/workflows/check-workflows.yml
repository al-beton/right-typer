name: GitHub Actions Validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      - name: Validate every workflow
        run: '"$RUNNER_TEMP/actionlint" -color'
