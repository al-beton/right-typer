name: Recorded camera accuracy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/tracking/**'
      - 'src/recording/**'
      - 'public/models/**'
      - 'scripts/benchmark/**'
      - 'scripts/dataset/library.py'
      - 'datasets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.benchmark.config.ts'
      - '.github/workflows/recorded-camera-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/tracking/**'
      - 'src/recording/**'
      - 'public/models/**'
      - 'scripts/benchmark/**'
      - 'datasets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.benchmark.config.ts'
      - '.github/workflows/recorded-camera-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: recorded-camera-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Download and verify the approved recording dataset
        run: python3 scripts/benchmark/prepare.py --output "$RUNNER_TEMP/camera-data"
      - name: Rerun MediaPipe and score production attribution
        run: pnpm benchmark:camera -- --input "$RUNNER_TEMP/camera-data/input.json" --output "$RUNNER_TEMP/camera-report"
      - name: Publish accuracy score
        run: cat "$RUNNER_TEMP/camera-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-camera-accuracy
          path: ${{ runner.temp }}/camera-report/
          if-no-files-found: error
          retention-days: 30
